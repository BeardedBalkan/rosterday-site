<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RosterDay — The survey has closed</title>
<meta name="description" content="Our volunteer coordination survey has closed. Thank you to every club that took part." />
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<!-- ============================================================
     ROSTERDAY — SURVEY CLOSED
     ------------------------------------------------------------
     Same two-part method as survey.html:
       1. CONFIG (bottom of file) — endpoint and all copy.
       2. Structure + CSS + renderer — leave alone.

     BEFORE GOING LIVE: paste the Apps Script /exec URL for the
     NEW sheet into CONFIG.endpoint. This is a different endpoint
     from the survey — don't reuse the old one, or these details
     will land in your survey responses.
     ============================================================ -->

<style>
  :root{
    --teal:#1F7A8C;
    --teal-deep:#155562;
    --teal-soft:#E8F1F3;
    --ivory:#F7F6F2;
    --cream:#FBF9F4;
    --ink:#0E1F26;
    --ink-soft:#1F2F36;
    --pewter:#74808A;
    --pewter-deep:#4F5961;
    --fog:#E4E7E8;
    --fog-deep:#D2D7D9;
    --sun:#F2B544;
    --sun-soft:#FCEFD4;
    --sun-deep:#9A6E12;
    --green:#4FA67A;
    --green-soft:#E1EFE6;
    --coral:#F08A7E;
    --coral-soft:#FBE3DF;
    --coral-deep:#B5544A;

    --font-display:"Inter Tight", system-ui, sans-serif;
    --font-body:"Inter", system-ui, sans-serif;

    --r-sm:6px; --r-md:8px; --r-lg:12px; --r-brand:14px; --r-xl:16px; --r-pill:999px;
    --shadow-1:0 1px 2px rgba(14,31,38,.06);
    --maxw:720px;
    --pad:clamp(1.25rem, 5vw, 2.5rem);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--ivory);color:var(--ink);
    font-family:var(--font-body);font-size:1rem;line-height:1.6;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;min-height:100vh;
  }
  a{color:var(--teal);}

  .wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--pad);}

  /* ---- masthead (identical to survey.html) ---- */
  .masthead{padding-block:2rem 1.25rem;}
  .logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;}
  .mark{
    width:40px;height:40px;border-radius:12px;
    background:linear-gradient(160deg,#1F7A8C 0%,#155562 100%);
    padding:9px;display:flex;flex-direction:column;justify-content:center;gap:4px;flex:none;
  }
  .mark .row{display:flex;align-items:center;gap:3px;}
  .mark .dot{width:4px;height:4px;border-radius:50%;background:#F2B544;flex:none;}
  .mark .dot.off{background:transparent;}
  .mark .bar{height:3.5px;border-radius:2px;background:#fff;}
  .mark .bar.b2{background:rgba(255,255,255,.72);}
  .mark .bar.b3{background:rgba(255,255,255,.48);}
  .wordmark{font:700 21px "Inter Tight",sans-serif;letter-spacing:-.01em;color:#0E1F26;}
  .wordmark span{font-weight:500;opacity:.6;}

  /* ---- head ---- */
  main{flex:1 0 auto;}
  .head{padding-block:clamp(2rem,6vw,3rem) 0;}
  .status{
    display:inline-flex;align-items:center;gap:.55rem;
    background:var(--sun-soft);color:var(--sun-deep);
    font-size:.82rem;font-weight:600;padding:.4rem .85rem;border-radius:var(--r-pill);
    margin-bottom:1.1rem;
  }
  .status svg{width:15px;height:15px;flex:none;}
  .head h1{
    font-family:var(--font-display);font-weight:700;
    font-size:clamp(1.9rem,1.4rem + 2vw,2.6rem);line-height:1.12;letter-spacing:-.02em;margin:0;
  }
  .head p{margin:1rem 0 0;color:var(--pewter-deep);font-size:1.05rem;}
  .head p.lede{font-size:1.12rem;color:var(--ink-soft);}

  .next{
    margin-top:1.75rem;padding:1.1rem 1.25rem;
    background:var(--teal-soft);border-radius:var(--r-lg);
    color:var(--teal-deep);font-size:.97rem;
  }
  .next strong{font-family:var(--font-display);font-weight:600;display:block;margin-bottom:.3rem;}

  /* ---- capture card ---- */
  .capture{
    background:#fff;border:1px solid var(--fog);border-radius:var(--r-xl);
    padding:clamp(1.4rem,4vw,1.9rem);margin-top:clamp(2rem,5vw,2.75rem);box-shadow:var(--shadow-1);
  }
  .capture h2{
    font-family:var(--font-display);font-weight:700;
    font-size:1.35rem;letter-spacing:-.015em;margin:0;
  }
  .capture .intro{margin:.55rem 0 0;color:var(--pewter);font-size:.97rem;}

  .field{margin-top:1.2rem;}
  .field label{
    display:block;font-family:var(--font-display);font-weight:600;
    font-size:.95rem;color:var(--ink);margin-bottom:.4rem;
  }
  .field .req{color:var(--coral-deep);font-weight:500;}
  .field input{
    width:100%;font-family:var(--font-body);font-size:1rem;color:var(--ink);
    background:var(--cream);border:1.5px solid var(--fog);border-radius:var(--r-lg);
    padding:.75rem .85rem;transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus{
    outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(31,122,140,.15);background:#fff;
  }
  .field.invalid input{border-color:var(--coral);}
  .field .err{margin:.45rem 0 0;color:var(--coral-deep);font-size:.87rem;font-weight:500;display:none;}
  .field.invalid .err{display:block;}

  .btn{
    font-family:var(--font-body);font-size:1rem;font-weight:600;
    padding:.8rem 1.5rem;border-radius:var(--r-lg);border:1.5px solid transparent;
    background:var(--teal-deep);color:#fff;cursor:pointer;margin-top:1.5rem;
    transition:background .15s ease, transform .15s ease;
  }
  .btn:hover{background:var(--teal);transform:translateY(-1px);}
  .btn:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
  .btn:disabled{opacity:.55;cursor:default;transform:none;}
  .privacy{margin:.9rem 0 0;color:var(--pewter);font-size:.85rem;}

  .sendfail{
    background:var(--coral-soft);border:1px solid var(--coral);color:var(--coral-deep);
    border-radius:var(--r-lg);padding:.9rem 1rem;margin-top:1rem;font-size:.92rem;display:none;
  }
  .sendfail.show{display:block;}

  /* ---- confirmation ---- */
  .saved{
    background:var(--teal-deep);color:#fff;border-radius:var(--r-xl);
    padding:clamp(1.6rem,5vw,2.25rem);margin-top:clamp(2rem,5vw,2.75rem);
  }
  .saved h2{font-family:var(--font-display);font-weight:700;font-size:1.45rem;letter-spacing:-.018em;margin:0;}
  .saved p{margin:.65rem 0 0;color:rgba(255,255,255,.82);}

  /* ---- footer ---- */
  .foot{
    flex-shrink:0;border-top:1px solid var(--fog);margin-top:clamp(2.5rem,7vw,4rem);
    padding-block:1.5rem 2.5rem;font-size:.85rem;color:var(--pewter);
    display:flex;flex-wrap:wrap;gap:.4rem 1.5rem;justify-content:space-between;
  }
  .foot a{text-decoration:none;font-weight:500;}
  .foot a:hover{text-decoration:underline;}

  [hidden]{display:none !important;}

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;}
    .btn:hover{transform:none;}
  }
</style>
</head>
<body>

  <div class="wrap masthead">
    <a class="logo" href="/">
      <span class="mark" aria-hidden="true">
        <span class="row"><span class="dot"></span><span class="bar" style="width:21px"></span></span>
        <span class="row"><span class="dot off"></span><span class="bar b2" style="width:16px"></span></span>
        <span class="row"><span class="dot off"></span><span class="bar b3" style="width:12px"></span></span>
      </span>
      <span class="wordmark">Roster<span>Day</span></span>
    </a>
  </div>

  <main class="wrap">

    <section class="head">
      <span class="status">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
        </svg>
        <span id="status-text"></span>
      </span>
      <h1 id="title"></h1>
      <p class="lede" id="thanks"></p>
      <p id="body"></p>
      <div class="next">
        <strong id="next-title"></strong>
        <span id="next-body"></span>
      </div>
    </section>

    <section class="capture" id="capture">
      <h2 id="cap-title"></h2>
      <p class="intro" id="cap-intro"></p>

      <form id="details" novalidate>
        <div class="field" id="f-name">
          <label for="in-name">Your name <span class="req">*</span></label>
          <input id="in-name" name="name" type="text" autocomplete="name" />
          <p class="err">Please add your name.</p>
        </div>

        <div class="field" id="f-club">
          <label for="in-club">Club <span class="req">*</span></label>
          <input id="in-club" name="club" type="text" autocomplete="organization"
                 placeholder="e.g. Strathfield Strikers FC" />
          <p class="err">Please add your club.</p>
        </div>

        <div class="field" id="f-email">
          <label for="in-email">Email <span class="req">*</span></label>
          <input id="in-email" name="email" type="email" autocomplete="email"
                 placeholder="you@yourclub.com.au" />
          <p class="err">Please add a valid email.</p>
        </div>

        <button class="btn" type="submit" id="send"></button>
        <p class="privacy" id="privacy"></p>
      </form>

      <div class="sendfail" id="sendfail"></div>
    </section>

    <section class="saved" id="saved" hidden>
      <h2 id="saved-title"></h2>
      <p id="saved-body"></p>
    </section>

  </main>

  <footer class="wrap foot">
    <span id="foot-left"></span>
    <a id="foot-right" href="#"></a>
  </footer>

<script>
/* ===========================================================
   CONFIG — the only block you edit.
   =========================================================== */
const CONFIG = {

  /* Apps Script /exec URL for the NEW details sheet.
     Leave empty to preview without sending anything. */
  endpoint: "https://script.google.com/macros/s/AKfycbyzthpN75B7fzrEXjiKFzo1o92-MJK25A2t2cY4_k53cBtnZaHgBA0as8qiOpIzllmICw/exec",

  contactEmail: "hello@rosterday.com.au",

  status: "Survey closed 30 September 2026",

  title: "The survey has closed. Thank you.",

  thanks: "To every committee member, volunteer coordinator and association delegate who took the time — thank you. You answered honestly about what actually happens at your club, and that's worth more than any amount of guesswork.",

  body: "Over one hundred clubs told us how they roster volunteers, what they've tried, and where it falls over. We're going through it properly now.",

  next: {
    title: "What happens next",
    body: "We're writing up what clubs told us into a short summary. Everyone who asked for it will get a copy by email — no need to do anything."
  },

  capture: {
    title: "Missed it, or want to hear how this develops?",
    intro: "Leave your details and we'll send you the summary when it's ready, along with anything useful we build off the back of it.",
    button: "Send my details",
    privacy: "We'll only use these to send you the summary and occasional updates. No lists, no spam, and you can tell us to stop any time."
  },

  saved: {
    title: "Got it — thank you.",
    body: "Your details are with us. We'll be in touch when the summary is ready."
  },

  footer: {
    left: "© 2026 RosterDay · Currently in development",
    right: "hello@rosterday.com.au"
  }
};

/* ===========================================================
   RENDERER — generic. No need to edit.
   =========================================================== */
(function () {
  const el = (id) => document.getElementById(id);

  /* ---- copy ---- */
  el("status-text").textContent = CONFIG.status;
  el("title").textContent      = CONFIG.title;
  el("thanks").textContent     = CONFIG.thanks;
  el("body").textContent       = CONFIG.body;
  el("next-title").textContent = CONFIG.next.title;
  el("next-body").textContent  = CONFIG.next.body;
  el("cap-title").textContent  = CONFIG.capture.title;
  el("cap-intro").textContent  = CONFIG.capture.intro;
  el("send").textContent       = CONFIG.capture.button;
  el("privacy").textContent    = CONFIG.capture.privacy;
  el("saved-title").textContent= CONFIG.saved.title;
  el("saved-body").textContent = CONFIG.saved.body;
  el("foot-left").textContent  = CONFIG.footer.left;
  el("foot-right").textContent = CONFIG.footer.right;
  el("foot-right").href        = "mailto:" + CONFIG.contactEmail;

  const fields = [
    { box: "f-name",  input: "in-name",  key: "name"  },
    { box: "f-club",  input: "in-club",  key: "club"  },
    { box: "f-email", input: "in-email", key: "email" }
  ];

  /* clear the error state as soon as they start fixing it */
  fields.forEach((f) => {
    el(f.input).addEventListener("input", () => el(f.box).classList.remove("invalid"));
  });

  function validate() {
    let firstBad = null;
    fields.forEach((f) => {
      const value = el(f.input).value.trim();
      let ok = !!value;
      if (ok && f.key === "email") ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
      el(f.box).classList.toggle("invalid", !ok);
      if (!ok && !firstBad) firstBad = el(f.box);
    });
    if (firstBad) {
      firstBad.scrollIntoView({ behavior: "smooth", block: "center" });
      firstBad.querySelector("input").focus({ preventScroll: true });
    }
    return !firstBad;
  }

  async function submit() {
    const btn = el("send");
    const fail = el("sendfail");
    fail.classList.remove("show");
    btn.disabled = true;
    btn.textContent = "Sending…";

    const payload = new URLSearchParams();
    fields.forEach((f) => payload.append(f.key, el(f.input).value.trim()));
    payload.append("submittedAt", new Date().toISOString());

    if (!CONFIG.endpoint) {
      console.log("Preview mode — nothing sent. Payload:", Object.fromEntries(payload));
      finish();
      return;
    }

    try {
      const res = await fetch(CONFIG.endpoint, { method: "POST", body: payload });
      if (!res.ok) throw new Error("bad status");
      finish();
    } catch (err) {
      btn.disabled = false;
      btn.textContent = CONFIG.capture.button;
      fail.innerHTML =
        "That didn't send. Try once more — or email us at <a href='mailto:" +
        CONFIG.contactEmail + "'>" + CONFIG.contactEmail + "</a> and we'll add you.";
      fail.classList.add("show");
    }
  }

  function finish() {
    el("capture").hidden = true;
    el("saved").hidden = false;
    el("saved").scrollIntoView({ behavior: "smooth", block: "center" });
  }

  el("details").addEventListener("submit", (e) => {
    e.preventDefault();
    if (validate()) submit();
  });
})();
</script>
</body>
</html>
